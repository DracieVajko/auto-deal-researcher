  # Optional baseline filters. Precedence: CLI > prompt/LLM > these defaults.
  # Canonical keys: min_price, max_price, condition, brand, location,
  # shipping, seller_type, sort, plus arbitrary extras (e.g. socket: AM5).
  default_filters: {}

  # Where you shop. Sites in this market are preferred, neighbouring EU
  # markets come next, the rest last.
  user_country: "SK"
  user_city: ""
  # How many shops may be opened per search round.
  max_sites: 8
  # Listing detail pages fetched per site per search. Adapters enrich the
  # cheapest listings first when this cap cuts the page.
  enrich_limit: 20
  # Static EUR rates for the currencies the sites list prices in.
  currency_rates:
    EUR: 1.0
    CZK: 0.0265

  # Currency in which the user wants to see prices (output currency).
  # Defaults to the currency of the user's country if not specified.
  default_currency: ""

  winners_count: 3
  max_rounds: 3
  retry_on_empty: true
  prune_after_days: 30
  diamond_search:
    enabled: true
    max_rounds: 3
    research_parallel: true
    expertise_parallel: true
    price_sequential: true
    confidence_threshold: 0.7
    llm_call_budget: 50
    llm_token_budget: 100000

llm:
  local:
    # Gemma 26B for general tasks; small bonsai/qwen 9B is preferred for tagging.
    - type: "lmstudio"
      endpoint: "http://localhost:1234"
      model: "google/gemma-4-26b-a4b"
    - type: "ollama"
      endpoint: "http://localhost:11434"
      model: "llama3.1:8b"
  api_fallback:
    # General instruct models first; the free OpenRouter model is code-oriented
    # and is kept only as a last resort.
    - provider: "mistral"
      api_key_env: "MISTRAL_API_KEY"
      model: "ministral-14b-2512"
    - provider: "gemini"
      api_key_env: "GEMINI_API_KEY"
      model: "gemini-2.5-flash"
    - provider: "openrouter"
      api_key_env: "OPENROUTER_API_KEY"
      model: "poolside/laguna-s-2.1:free"
  # Legacy fields (for backward compatibility)
  # Secrets are read from the environment — copy .env.example to .env and fill
  # in your own keys. Never commit real keys.
  local_endpoint: "http://localhost:1234"
  model_name: "llama3"

output:
  format: "both"
  directory: "./results"
  # Force a product domain (bike, computer, phone, car, furniture, generic).
  # Empty means auto-detect from the listing text; --domain overrides this.
  domain: ""

schedule:
  tasks:
    - name: "daily-drone-search"
      prompt_file: "prompts/auto.yaml"
      times: ["08:00", "20:00"]
      enabled: true

browser:
  cdp_endpoint: "http://127.0.0.1:9222"
  use_persistent_context: true
  user_data_dir: "./browser_profile"
  headless: true
  slow_mo: 0

storage:
  db_path: "./data/deals.db"

notifications:
  default_cooldown_seconds: 3600
  channels:
    - name: "console"
      type: "console"
      cooldown_seconds: 60
      rate_limit: 10
      settings: {}