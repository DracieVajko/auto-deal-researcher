search:
  websites:
    # --- verified / adapter-backed -------------------------------------
    - name: "alza"
      base_url: "https://www.alza.sk"
      enabled: true
      adapter_class: "alza"
      categories: ["electronics", "appliances"]
      conditions: ["new", "open_box"]
    - name: "bazos"
      base_url: "https://www.bazos.sk"
      enabled: true
      adapter_class: "bazos"
      categories: ["electronics", "appliances", "auto", "general"]
      conditions: ["used"]

    # --- blocked / login-only ------------------------------------------
    - name: "backmarket"
      base_url: "https://www.backmarket.sk"
      enabled: false
      adapter_class: "backmarket"
      categories: ["electronics"]
      conditions: ["refurbished"]
    - name: "ebay"
      base_url: "https://www.ebay.de"
      enabled: false
      adapter_class: "ebay"
      categories: ["electronics", "appliances", "auto", "general"]
      conditions: ["used", "refurbished", "new", "open_box"]
    - name: "facebook"
      base_url: "https://www.facebook.com/marketplace"
      enabled: false
      adapter_class: "facebook"
      categories: ["electronics", "appliances", "auto", "general"]
      conditions: ["used", "marketplace"]
      requires_login: true

    # --- planned: enable after `discover_sites.py` writes a validated
    # --- profile, or after an adapter is registered --------------------
    - name: "mall"
      base_url: "https://www.mall.sk"
      enabled: false
      adapter_class: "mall"
      categories: ["electronics", "appliances", "auto", "general"]
      conditions: ["new", "open_box"]
    - name: "nay"
      base_url: "https://www.nay.sk"
      enabled: false
      adapter_class: "nay"
      categories: ["electronics", "appliances"]
      conditions: ["new", "open_box"]
    - name: "datart"
      base_url: "https://www.datart.sk"
      enabled: false
      adapter_class: "datart"
      categories: ["electronics", "appliances"]
      conditions: ["new", "open_box"]
    - name: "heureka"
      base_url: "https://www.heureka.sk"
      enabled: false
      adapter_class: "heureka"
      categories: ["electronics", "appliances", "auto", "general"]
      conditions: ["new", "used", "refurbished"]
    - name: "idealo"
      base_url: "https://www.idealo.de"
      enabled: false
      adapter_class: "idealo"
      categories: ["electronics", "appliances", "auto"]
      conditions: ["new", "used", "refurbished"]
    - name: "aukro"
      base_url: "https://aukro.cz"
      enabled: false
      adapter_class: "aukro"
      categories: ["electronics", "appliances", "auto", "general"]
      conditions: ["new", "used", "refurbished", "open_box"]
    - name: "sbazar"
      base_url: "https://www.sbazar.cz"
      enabled: false
      adapter_class: "sbazar"
      categories: ["electronics", "appliances", "auto", "general"]
      conditions: ["used"]
    - name: "bazos_cz"
      base_url: "https://www.bazos.cz"
      enabled: false
      adapter_class: "bazos"
      categories: ["electronics", "appliances", "auto", "general"]
      conditions: ["used"]
    - name: "amazon_de"
      base_url: "https://www.amazon.de"
      enabled: false
      adapter_class: "amazon"
      categories: ["electronics", "appliances", "auto", "general"]
      conditions: ["new", "used", "refurbished", "open_box"]
    - name: "alza_cz"
      base_url: "https://www.alza.cz"
      enabled: false
      adapter_class: "alza"
      categories: ["electronics", "appliances"]
      conditions: ["new", "open_box"]
    - name: "aliexpress"
      base_url: "https://www.aliexpress.com"
      enabled: false
      adapter_class: "aliexpress"
      categories: ["electronics", "appliances", "auto", "general"]
      conditions: ["new"]
    - name: "prisiel"
      base_url: "https://www.prisiel.sk"
      enabled: false
      adapter_class: "prisiel"
      categories: ["electronics"]
      conditions: ["new", "used"]
    - name: "bazar_sk"
      base_url: "https://www.bazar.sk"
      enabled: false
      adapter_class: "bazar_sk"
      categories: ["electronics", "appliances", "auto", "general"]
      conditions: ["used"]
    - name: "sauto"
      base_url: "https://www.sauto.cz"
      enabled: false
      adapter_class: "sauto"
      categories: ["auto"]
      conditions: ["used", "new"]
    - name: "sreality"
      base_url: "https://www.sreality.cz"
      enabled: false
      adapter_class: "sreality"
      categories: ["general"]
      conditions: ["new", "used"]
    - name: "mimibazar"
      base_url: "https://www.mimibazar.sk"
      enabled: false
      adapter_class: "mimibazar"
      categories: ["electronics", "appliances", "auto", "general"]
      conditions: ["used"]

  # Optional baseline filters. Precedence: CLI > prompt/LLM > these defaults.
  # Canonical keys: min_price, max_price, condition, brand, location,
  # shipping, seller_type, sort, plus arbitrary extras (e.g. socket: AM5).
  default_filters: {}

  winners_count: 3
  max_rounds: 3
  retry_on_empty: true
  prune_after_days: 30
  diamond_search:
    enabled: true
    max_rounds: 3
    research_parallel: true
    expertise_parallel: true
    price_sequential: true
    confidence_threshold: 0.7
    llm_call_budget: 50
    llm_token_budget: 100000

llm:
  local:
    - type: "lmstudio"
      endpoint: "http://localhost:1234"
      model: "qwen/qwen3-coder-30b"
    - type: "ollama"
      endpoint: "http://localhost:11434"
      model: "llama3.1:8b"
  api_fallback:
    - provider: "openrouter"
      api_key_env: "OPENROUTER_API_KEY"
      model: "poolside/laguna-s-2.1:free"
    - provider: "gemini"
      api_key_env: "GEMINI_API_KEY"
      model: "gemini-3.7-flash"
    - provider: "mistral"
      api_key_env: "MISTRAL_API_KEY"
      model: "ministral-14b-2512"
  # Legacy fields (for backward compatibility)
  # Secrets are read from the environment — copy .env.example to .env and fill
  # in your own keys. Never commit real keys.
  local_endpoint: "http://localhost:1234"
  model_name: "llama3"

output:
  format: "both"
  directory: "./results"

schedule:
  tasks:
    - name: "daily-drone-search"
      prompt_file: "prompts/auto.yaml"
      times: ["08:00", "20:00"]
      enabled: true

browser:
  cdp_endpoint: "http://127.0.0.1:9222"
  use_persistent_context: true
  user_data_dir: "./browser_profile"
  headless: true
  slow_mo: 0

storage:
  db_path: "./data/deals.db"

notifications:
  default_cooldown_seconds: 3600
  channels:
    - name: "console"
      type: "console"
      cooldown_seconds: 60
      rate_limit: 10
      settings: {}