[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-deal-searcher"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.64.1",
    "pydantic>=2.14.3",
    "typer>=0.27.3",
    "requests>=2.32.0",
    "pyyaml",
    "aiohttp",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
storage = ["sqlite-utils>=3.35"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "mypy",
    "ruff",
]

[project.entry-points."ads.adapters"]
# Third-party adapters register here, e.g.:
# acme = "mypackage.adapters:AcmeAdapter"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "BLE",    # flake8-blind-except
    "S",      # flake8-bandit
    "ASYNC",  # flake8-async
    "DTZ",    # flake8-datetimez
    "RUF",    # ruff-specific
    "TRY",    # tryceratops
    "PLW",    # pylint warnings
]
ignore = [
    "S101",   # assert usage (tests)
    "E501",   # line length: enforced by black instead (long URLs/user-agents can't split)
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
explicit_package_bases = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
markers = [
    "live: marks tests requiring network access (deselect with '-m \"not live\"')",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
