version: 1
site_id: obi_sk
base_url: https://www.obi.sk
status: draft
currency: EUR
search:
  url_template: https://www.obi.sk/search?search={query}
  query_param: search
  input_selector: '#find-suchfeld'
  category_urls:
    home: https://www.obi.sk/search?search={query}
filters:
  condition:
    ui:
      kind: button
      selector: button[aria-label="pozastaviť\ automatickú\ animáciu"]
      value_map: {}
    source: heuristic
    confidence: 0.4
    sample_value: pozastaviť automatickú animáciu
  extras: {}
extraction:
  item_selector: .product, .item, .product-card, .item-card, [data-product]
  title_selector: h1, h2, h3, .title, .product-title, .name
  price_selector: .price, .price-box__price, .product-price, [class*='price']
  link_selector: a[href]
  image_selector: img
  condition_selector: .condition, .badge, .label
  seller_selector: .seller, .shop, .merchant
notes: Search page captured, but no result cards matched the selector.
